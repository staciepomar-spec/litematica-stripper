plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = project.mod_version
group = project.group

loom {
    mixin {
        defaultRefmapName = "litematica-block-filter.refmap.json"
    }
}

base {
    archivesName = "[投影剥离] ${project.mod_id}"
}

repositories {
    maven { url = 'https://masa.dy.fi/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"
    compileOnly files("C:/Users/Iss.WR/AppData/Local/Temp/printer-nested/extracted/META-INF/jars/litematica-printer-1.21.1-2.4+20241120.jar")
    modCompileOnly files("C:/Users/Iss.WR/AppData/Local/Temp/litematica-src-a4a04f509c8e4a1b8d11d1d6e97eaea9/build/devlibs/litematica-fabric-1.21.1-0.19.60-dev.jar")
}

processResources {
    inputs.property "version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}
